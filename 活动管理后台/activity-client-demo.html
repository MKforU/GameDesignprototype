<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>活动中心 - 手机竖屏原型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0a1a;
    color: #fff;
    font-size: 14px;
    overflow: hidden;
  }

  /* ==================== 手机框 ==================== */
  .phone-frame {
    width: 375px;
    height: 812px;
    margin: 20px auto;
    border-radius: 40px;
    border: 6px solid #333;
    overflow: hidden;
    position: relative;
    background: #0a0a1a;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 30px;
    background: #333;
    border-radius: 0 0 20px 20px;
    z-index: 100;
  }
  .phone-status-bar {
    height: 44px;
    background: rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 12px;
    color: #fff;
    position: relative;
    z-index: 50;
  }

  /* ==================== 主容器 ==================== */
  .app-container {
    height: calc(100% - 44px);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ==================== KV背景区域 ==================== */
  .kv-section {
    position: relative;
    min-height: 320px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .kv-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-size: cover;
    background-position: center;
    filter: brightness(0.6);
  }
  .kv-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(10,10,26,0.8) 85%, rgba(10,10,26,1) 100%);
  }
  .kv-content {
    position: relative;
    z-index: 10;
    padding: 12px 16px 20px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* 顶部导航 */
  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    border: none;
    color: #fff;
  }
  .point-balance {
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 6px 14px;
    display: flex;
    gap: 14px;
    font-size: 12px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .point-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .point-item .icon { font-size: 14px; }
  .point-item .label { color: rgba(255,255,255,0.6); }
  .point-item .value { font-weight: 700; color: #ffd700; }

  /* KV信息 */
  .kv-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .kv-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    line-height: 1.2;
  }
  .kv-subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    margin-bottom: 10px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .kv-countdown {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,77,77,0.2);
    border: 1px solid rgba(255,77,77,0.4);
    border-radius: 16px;
    padding: 4px 12px;
    font-size: 12px;
    color: #ff6b6b;
    width: fit-content;
    animation: countdownPulse 2s infinite;
  }
  .kv-points-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .kv-point-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 4px 12px 4px 8px;
    font-size: 12px;
  }
  .kv-point-badge .icon { font-size: 14px; }
  .kv-point-badge .label { color: rgba(255,255,255,0.5); }
  .kv-point-badge .value { font-weight: 700; color: #ffd700; }
  @keyframes countdownPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* ==================== Tab栏 ==================== */
  .tab-bar {
    display: flex;
    background: rgba(20,20,40,0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.08);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
    position: relative;
    z-index: 20;
  }
  .tab-item {
    flex: 1;
    padding: 12px 0;
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    position: relative;
    transition: color 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border: none;
    background: none;
  }
  .tab-item.active {
    color: #ffd700;
    font-weight: 600;
  }
  .tab-item.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 20%;
    right: 20%;
    height: 3px;
    background: linear-gradient(90deg, #ffd700, #ffaa00);
    border-radius: 2px;
  }
  .tab-item .red-dot {
    width: 8px;
    height: 8px;
    background: #ff4d4f;
    border-radius: 50%;
    position: absolute;
    top: 8px;
    right: 20%;
    display: none;
  }
  .tab-item .red-dot.show { display: block; animation: dotPulse 1.5s infinite; }
  @keyframes dotPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  /* ==================== 内容区 ==================== */
  .content-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px;
    background: #0a0a1a;
    -webkit-overflow-scrolling: touch;
  }
  .content-area::-webkit-scrollbar { display: none; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ==================== 任务卡片 ==================== */
  .task-card {
    background: linear-gradient(135deg, rgba(30,30,60,0.9), rgba(20,20,50,0.9));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
  }
  .task-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent);
  }
  .task-card.completed {
    border-color: rgba(76,175,80,0.3);
  }
  .task-card.completed::before {
    background: linear-gradient(90deg, transparent, rgba(76,175,80,0.5), transparent);
  }
  .task-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .task-name {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .task-name .icon { font-size: 18px; }
  .task-type-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255,215,0,0.15);
    color: #ffd700;
    border: 1px solid rgba(255,215,0,0.2);
  }

  /* 奖励预览 */
  .reward-preview {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .reward-item {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,165,0,0.1);
    border: 1px solid rgba(255,165,0,0.2);
    border-radius: 8px;
    padding: 4px 8px;
  }
  .reward-item .reward-icon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: linear-gradient(135deg, #ff8c00, #ff6347);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .reward-item .reward-info {
    font-size: 11px;
  }
  .reward-item .reward-name { color: rgba(255,255,255,0.7); }
  .reward-item .reward-amount { color: #ffd700; font-weight: 600; }

  /* 进度条 */
  .progress-section {
    margin-bottom: 10px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 4px;
  }
  .progress-bar {
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
    position: relative;
  }
  .progress-fill.active {
    background: linear-gradient(90deg, #ffd700, #ffaa00);
    box-shadow: 0 0 8px rgba(255,215,0,0.4);
  }
  .progress-fill.done {
    background: linear-gradient(90deg, #4caf50, #66bb6a);
  }

  /* 任务按钮 */
  .task-action {
    display: flex;
    justify-content: flex-end;
  }
  .btn-action {
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.3s;
  }
  .btn-action.primary {
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    color: #1a1a2e;
    box-shadow: 0 4px 12px rgba(255,215,0,0.3);
  }
  .btn-action.primary:active {
    transform: scale(0.95);
    box-shadow: 0 2px 6px rgba(255,215,0,0.2);
  }
  .btn-action.claim {
    background: linear-gradient(135deg, #4caf50, #66bb6a);
    color: #fff;
    box-shadow: 0 4px 12px rgba(76,175,80,0.3);
    animation: claimPulse 1.5s infinite;
  }
  @keyframes claimPulse {
    0%, 100% { box-shadow: 0 4px 12px rgba(76,175,80,0.3); }
    50% { box-shadow: 0 4px 20px rgba(76,175,80,0.6); }
  }
  .btn-action.done {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4);
    cursor: default;
  }

  /* ==================== 商城网格 ==================== */
  .shop-balance-card {
    background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(255,170,0,0.3);
    position: relative;
    overflow: hidden;
  }
  .shop-balance-card::before {
    content: '💰';
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 52px;
    opacity: 0.18;
  }
  .balance-label {
    font-size: 12px;
    color: rgba(60,40,0,0.7);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .balance-value {
    font-size: 32px;
    font-weight: 800;
    color: #3d2900;
    line-height: 1;
    margin-bottom: 6px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .balance-hint {
    font-size: 11px;
    color: rgba(60,40,0,0.5);
  }
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .shop-card {
    background: linear-gradient(135deg, rgba(30,30,60,0.9), rgba(20,20,50,0.9));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .shop-card:active {
    transform: scale(0.95);
  }
  .shop-card.sold-out {
    opacity: 0.45;
  }
  .shop-card .item-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff8c00, #ff4500);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 8px;
    position: relative;
    overflow: hidden;
  }
  .shop-card .item-icon::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
    animation: iconShine 3s infinite;
  }
  @keyframes iconShine {
    0% { transform: translateX(-100%) rotate(45deg); }
    100% { transform: translateX(100%) rotate(45deg); }
  }
  .shop-card .item-name {
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }
  .shop-card .item-cost {
    font-size: 14px;
    font-weight: 800;
    color: #ffd700;
    margin-bottom: 2px;
  }
  .shop-card .item-stock {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
  }
  .shop-card .btn-buy {
    margin-top: 6px;
    width: 100%;
    padding: 5px 0;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    text-align: center;
  }
  .shop-card .btn-buy.can-buy {
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    color: #1a1a2e;
  }
  .shop-card .btn-buy.cant-buy {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4);
    font-size: 10px;
  }
  }
  .shop-card .btn-buy.can-buy .short-info { color: rgba(26,26,46,0.6); }

  /* ==================== 里程碑 ==================== */
  .milestone-dim-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .dim-tab {
    flex: 1;
    padding: 8px 0;
    text-align: center;
    border-radius: 10px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.5);
    transition: all 0.3s;
  }
  .dim-tab.active {
    background: rgba(255,215,0,0.15);
    border-color: rgba(255,215,0,0.3);
    color: #ffd700;
    font-weight: 600;
  }

  /* 当前进度卡 - 置顶，始终可见 */
  .ms-current-card {
    background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,170,0,0.05));
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .ms-current-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .ms-current-points {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
  }
  .ms-current-points .num {
    font-size: 28px;
    font-weight: 800;
    color: #ffd700;
    margin: 0 2px;
  }
  .ms-current-points .unit {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
  }

  /* 下一档奖励预览 - 大卡片，始终可见 */
  .ms-next-reward {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .ms-next-reward::before {
    content: '下一档';
    position: absolute;
    top: 0;
    left: 0;
    background: rgba(255,215,0,0.3);
    color: #ffd700;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 0 0 8px 0;
    font-weight: 600;
  }
  .ms-next-reward.achieved::before {
    content: '已达成';
    background: rgba(76,175,80,0.3);
    color: #66bb6a;
  }
  .ms-next-reward .reward-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff8c00, #ff4500);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    margin-top: 16px;
  }
  .ms-next-reward .reward-info { flex: 1; margin-top: 16px; }
  .ms-next-reward .reward-name {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    margin-bottom: 2px;
  }
  .ms-next-reward .reward-amount {
    font-size: 12px;
    color: #ffd700;
  }
  .ms-next-reward .reward-diff {
    text-align: right;
    margin-top: 16px;
  }
  .ms-next-reward .diff-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
  }
  .ms-next-reward .diff-value {
    font-size: 16px;
    font-weight: 700;
    color: #ff6b6b;
  }
  .ms-next-reward.all-done {
    border-color: rgba(76,175,80,0.3);
    background: rgba(76,175,80,0.1);
  }
  .ms-next-reward.all-done .diff-value {
    color: #66bb6a;
  }
  .ms-next-reward .claim-btn {
    position: absolute;
    right: 12px;
    bottom: 12px;
    padding: 6px 18px;
    border-radius: 16px;
    background: linear-gradient(135deg, #4caf50, #66bb6a);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(76,175,80,0.4);
    animation: claimPulse 1.5s infinite;
  }
  .ms-next-reward .claim-btn:active {
    transform: scale(0.95);
  }

  .milestone-progress {
    background: rgba(30,30,60,0.9);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .ms-progress-track {
    height: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 5px;
    position: relative;
    margin-bottom: 8px;
    overflow: visible;
  }
  .ms-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd700, #ffaa00);
    border-radius: 5px;
    transition: width 0.8s ease;
    position: relative;
  }
  .ms-nodes {
    display: flex;
    justify-content: space-between;
    position: relative;
    margin-top: -18px;
    padding: 0 4px;
  }
  .ms-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .ms-node-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    position: relative;
    z-index: 2;
  }
  .ms-node-dot.locked {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.3);
  }
  .ms-node-dot.unlocked {
    background: linear-gradient(135deg, #4caf50, #66bb6a);
    border: 2px solid #66bb6a;
    color: #fff;
    box-shadow: 0 0 8px rgba(76,175,80,0.4);
  }
  .ms-node-dot.current {
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    border: 2px solid #ffd700;
    color: #1a1a2e;
    box-shadow: 0 0 12px rgba(255,215,0,0.5);
    animation: currentPulse 2s infinite;
  }
  @keyframes currentPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255,215,0,0.4); }
    50% { box-shadow: 0 0 16px rgba(255,215,0,0.7); }
  }
  .ms-node-label {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
  }

  /* 已完成里程碑 - 紧凑列表 */
  .ms-done-section {
    margin-top: 14px;
  }
  .ms-done-title {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 8px;
    padding-left: 4px;
  }
  .milestone-item {
    background: linear-gradient(135deg, rgba(30,30,60,0.9), rgba(20,20,50,0.9));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .milestone-item.locked {
    opacity: 0.5;
  }
  .ms-item-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;

            <span class="icon">${t.icon}</span>
            ${t.name}
            <span class="task-type-tag">${t.type}</span>
            ${refreshTag} ${modeTag}
          </div>
        </div>
        <div class="reward-preview">${rewards}</div>
        <div class="progress-section">
          <div class="progress-info">
            <span>${t.progress}/${t.maxTimes} · ${getTargetDesc(t)}</span>
            <span>${t.points>0?'+'+t.points+'积分':''}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill ${isDone?'done':'active'}" style="width:${pct*100}%"></div>
          </div>
        </div>
        <div class="task-action">${btnHtml}</div>
      </div>`;
  }).join('');
}

// ==================== 渲染商城 ====================
function renderShop(a) {
  const el = document.getElementById('panel-shop');

  // 顶部积分余额卡片
  let html = '<div class="shop-balance-card">' +
    '<div class="balance-label">我的商城积分</div>' +
    '<div class="balance-value">' + a.shopPoints.toLocaleString() + '</div>' +
    '<div class="balance-hint">完成任务可获得商城积分</div>' +
  '</div>';

  if (!a.shop.length) {
    el.innerHTML = html + '<div class="empty-state"><div class="icon">🛒</div><div class="text">暂无商品</div></div>';
    return;
  }
  const cards = a.shop.map(s => {
    const canBuy = a.shopPoints >= s.cost && s.canBuy;
    const limitText = s.limit > 0 ? (s.bought + '/' + s.limit) : '';
    const soldOut = s.limit > 0 && s.bought >= s.limit;

    let btnHtml = '';
    if (soldOut) {
      btnHtml = '<button class="btn-buy cant-buy">已售罄</button>';
    } else if (canBuy) {
      btnHtml = '<button class="btn-buy can-buy" onclick="buyItem(' + s.id + ')">兑换</button>';
    } else {
      btnHtml = '<button class="btn-buy cant-buy">积分不足</button>';
    }

    return '<div class="shop-card ' + (soldOut ? 'sold-out' : '') + '" onclick="' + (canBuy ? 'buyItem(' + s.id + ')' : '') + '">' +
      '<div class="item-icon">' + s.icon + '</div>' +
      '<div class="item-name">' + s.name + '</div>' +
      '<div class="item-cost">' + s.cost.toLocaleString() + '</div>' +
      '<div class="item-stock">' + limitText + '</div>' +
      btnHtml +
    '</div>';
  }).join('');
  el.innerHTML = html + '<div class="shop-grid">' + cards + '</div>';
}

// ==================== 渲染里程碑 ====================
function renderMilestone(a) {
  const el = document.getElementById('panel-milestone');

  let msList = [];
  if (currentMsDim === 'personal') msList = a.milestones || [];
  else if (currentMsDim === 'team') msList = a.milestonesTeam || [];
  else msList = a.milestonesServer || [];

  const dimLabel = { personal:'👤 个人', team:'👥 战队', server:'🌐 全服' };

  let html = '<div class="milestone-dim-tabs">' +
    ['personal','team','server'].map(d => {
      const list = d==='personal'?a.milestones:d==='team'?a.milestonesTeam:a.milestonesServer;
      return '<div class="dim-tab ' + (currentMsDim===d?'active':'') + '" onclick="switchMsDim(\'' + d + '\')">' + dimLabel[d] + (list.length?'('+list.length+')':'') + '</div>';
    }).join('') +
  '</div>';

  if (!msList.length) {
    html += '<div class="empty-state"><div class="icon">🏆</div><div class="text">该维度暂无里程碑</div></div>';
  } else {
    // 当前进度卡
    html += '<div class="ms-current-card">' +
      '<div class="ms-current-top">' +
        '<div class="ms-current-points">' +
          '<div style="color:rgba(255,255,255,0.5);font-size:12px;">' + dimLabel[currentMsDim] + '里程碑积分</div>' +
          '<div><span class="num">' + a.msPoints.toLocaleString() + '</span><span class="unit"> 积分</span></div>' +
        '</div>' +
      '</div>';

    // 奖励预览卡
    const claimableMs = msList.find(m => m.status === 'claimable');
    const nextMs = msList.find(m => a.msPoints < m.points);
    const allDone = !nextMs && !claimableMs;

    if (claimableMs) {
      // 有可领取的 - 显示「已达成」卡片
      html += '<div class="ms-next-reward achieved" style="border-color:rgba(76,175,80,0.3);background:rgba(76,175,80,0.08);">' +
        '<div class="reward-icon" style="background:linear-gradient(135deg,#4caf50,#66bb6a);">' + claimableMs.reward.icon + '</div>' +
        '<div class="reward-info">' +
          '<div class="reward-name">已达成 · ' + claimableMs.points + '积分</div>' +
          '<div class="reward-amount">' + claimableMs.reward.name + ' ×' + claimableMs.reward.amount + '</div>' +
        '</div>' +
        '<button class="claim-btn" onclick="claimMilestone(' + claimableMs.id + ')">🎁 领取</button>' +
      '</div>';
    } else if (nextMs) {
      // 无可领取 - 显示「下一档」目标
      const diff = nextMs.points - a.msPoints;
      html += '<div class="ms-next-reward">' +
        '<div class="reward-icon">' + nextMs.reward.icon + '</div>' +
        '<div class="reward-info">' +
          '<div class="reward-name">下一档 · ' + nextMs.points + '积分</div>' +
          '<div class="reward-amount">' + nextMs.reward.name + ' ×' + nextMs.reward.amount + '</div>' +
        '</div>' +
        '<div class="reward-diff">' +
          '<div class="diff-label">还差</div>' +
          '<div class="diff-value">' + diff.toLocaleString() + '</div>' +
        '</div>' +
      '</div>';
    } else {
      html += '<div class="ms-next-reward all-done">' +
        '<div class="reward-icon" style="background:linear-gradient(135deg,#4caf50,#66bb6a);">🎉</div>' +
        '<div class="reward-info">' +
          '<div class="reward-name">全部达成！</div>' +
          '<div class="reward-amount">已解锁所有里程碑奖励</div>' +
        '</div>' +
        '<div class="reward-diff">' +
          '<div class="diff-value">✅</div>' +
        '</div>' +
      '</div>';
    }
    html += '</div>';

    // 进度条+节点
    const maxPts = Math.max(...msList.map(m => m.points));
    const fillPct = Math.min(a.msPoints / maxPts, 1);

    const nodes = msList.map(m => {
      let dotClass = 'locked';
      let icon = '🔒';
      if (a.msPoints >= m.points) {
        if (m.status === 'claimed') { dotClass = 'unlocked'; icon = '✅'; }
        else { dotClass = 'current'; icon = '🎁'; }
      }
      return '<div class="ms-node">' +
        '<div class="ms-node-dot ' + dotClass + '">' + icon + '</div>' +
        '<div class="ms-node-label">' + m.points + '</div>' +
      '</div>';
    }).join('');

    html += '<div class="milestone-progress" style="padding:16px 16px 24px;">' +
      '<div class="ms-progress-track">' +
        '<div class="ms-progress-fill" style="width:' + (fillPct*100) + '%"></div>' +
      '</div>' +
      '<div class="ms-nodes">' + nodes + '</div>' +
    '</div>';

    // 已完成的里程碑列表
    const claimed = msList.filter(m => m.status === 'claimed');
    const locked = msList.filter(m => m.status === 'locked');

    // 已完成的
    if (claimed.length > 0) {
      html += '<div class="ms-done-section"><div class="ms-done-title">✅ 已完成</div>';
      claimed.forEach(m => {
        html += '<div class="milestone-item">' +
          '<div class="ms-item-icon">' + m.reward.icon + '</div>' +
          '<div class="ms-item-info">' +
            '<div class="ms-item-points">' + m.points.toLocaleString() + ' 积分</div>' +
            '<div class="ms-item-reward-text">' + m.reward.name + ' ×' + m.reward.amount + '</div>' +
          '</div>' +
          '<div class="ms-item-status done">已领取</div>' +
        '</div>';
      });
      html += '</div>';
    }

    // 未达成的
    if (locked.length > 0) {
      html += '<div class="ms-done-section"><div class="ms-done-title">🔒 未达成</div>';
      locked.forEach(m => {
        const diff = m.points - a.msPoints;
        html += '<div class="milestone-item locked">' +
          '<div class="ms-item-icon">' + m.reward.icon + '</div>' +
          '<div class="ms-item-info">' +
            '<div class="ms-item-points">' + m.points.toLocaleString() + ' 积分</div>' +
            '<div class="ms-item-reward-text">' + m.reward.name + ' ×' + m.reward.amount + '</div>' +
          '</div>' +
          '<div style="font-size:11px;color:#ff6b6b;">差' + diff.toLocaleString() + '</div>' +
        '</div>';
      });
      html += '</div>';
    }
  }

  el.innerHTML = html;
}

function switchMsDim(dim) {
  currentMsDim = dim;
  renderMilestone(activities[currentActivityIdx]);
}

// ==================== 交互：领取任务奖励 ====================
function claimTask(taskId) {
  const a = activities[currentActivityIdx];
  const t = a.tasks.find(x => x.id === taskId);
  if (!t || t.status !== 'claimable') return;

  // 扣积分飘字
  showFloatPoints(t.points);

  // 更新状态
  t.status = 'completed';
  a.shopPoints += t.points;
  a.msPoints += t.points;

  // 弹窗
  showClaimModal(t.rewardList.map(r => ({ icon:'🎁', name:r.name, amount:r.amount })));
}

// ==================== 交互：购买商品 ====================
function buyItem(itemId) {
  const a = activities[currentActivityIdx];
  const s = a.shop.find(x => x.id === itemId);
  if (!s || a.shopPoints < s.cost || !s.canBuy) return;

  a.shopPoints -= s.cost;
  s.bought++;
  if (s.limit > 0 && s.bought >= s.limit) s.canBuy = false;

  showFloatPoints(-s.cost);
  showClaimModal([{ icon:s.icon, name:s.name, amount:1 }]);
}

// ==================== 交互：领取里程碑 ====================
function claimMilestone(msId) {
  const a = activities[currentActivityIdx];
  const m = a.milestones.find(x => x.id === msId);
  if (!m || m.status !== 'claimable') return;

  m.status = 'claimed';
  showClaimModal([{ icon:m.reward.icon, name:m.reward.name, amount:m.reward.amount }]);
}

// ==================== 交互：前往任务 ====================
function goTask(taskId) {
  // 模拟跳转到玩法
  showFloatPoints(0, '🔄 跳转到对应玩法...');
}

// ==================== 领奖弹窗 ====================
function showClaimModal(rewards) {
  const display = document.getElementById('claimRewardDisplay');
  display.innerHTML = rewards.map(r => `
    <div class="big-icon">${r.icon}</div>
  `).join('');
  document.getElementById('claimModal').classList.add('show');
}

function closeClaimModal() {
  document.getElementById('claimModal').classList.remove('show');
  renderAll();
}

// ==================== 积分飘字 ====================
function showFloatPoints(pts, customText) {
  const container = document.getElementById('floatPoints');
  container.innerHTML = '';
  if (customText) {
    container.innerHTML = `<div class="float-point" style="color:#fff;">${customText}</div>`;
  } else {
    const sign = pts >= 0 ? '+' : '';
    container.innerHTML = `<div class="float-point">${sign}${pts} 商城积分</div><div class="float-point">${sign}${pts} 里程碑积分</div>`;
  }
  setTimeout(() => { container.innerHTML = ''; }, 1500);
}

// ==================== 规则弹窗 ====================
function showRules() {
  const a = activities[currentActivityIdx];
  document.getElementById('rulesContent').textContent = a.rules || '暂无活动规则';
  document.getElementById('rulesModal').classList.add('show');
}
function closeRules() {
  document.getElementById('rulesModal').classList.remove('show');
}

// ==================== 初始化 ====================
renderAll();
</script>
</body>
</html>
